spring.application.name=demoStudentManagementSystem
server.port=8080

# Management & Actuator Endpoints Exposure
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Datasource Configuration (H2 In-Memory Database for local dev & testing)
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# H2 Console (Access: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
